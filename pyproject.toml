[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xborder-recon"
version = "0.1.0"
description = "跨境平台结算与手工账本的最小可用对账引擎"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "xborder-recon contributors" }]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xrecon = "xrecon.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xrecon = ["rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
